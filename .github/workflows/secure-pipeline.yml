name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download project code
      - name: Checkout Source Code
        id: checkout
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Step 4: Run automated tests
      - name: Run Pytest
        run: pytest -v

      # Step 5: Build Docker image
      - name: Build Docker Image
        id: build_image
        run: docker build -t secure-cicd-app .

      # Step 6: Generate Trivy security report
      - name: Generate Trivy Report
        if: always() && steps.build_image.outcome == 'success'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/project" \
            aquasec/trivy:latest image \
            --format json \
            --output /project/trivy-report.json \
            secure-cicd-app

      # Step 7: Check HIGH and CRITICAL vulnerabilities
      - name: Trivy Security Gate
        if: always() && steps.build_image.outcome == 'success'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            secure-cicd-app

      # Step 8: Upload security report
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn